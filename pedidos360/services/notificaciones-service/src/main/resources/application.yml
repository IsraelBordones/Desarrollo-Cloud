server:
  port: 8084

spring:
  application:
    name: notificaciones-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:notificacionesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: ${SQL_INIT_MODE:always}
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

# Azure AD (Microsoft Entra ID) OAuth2 resource server settings.
# issuer-uri and audience come from your Entra ID App Registration.
azure:
  tenant-id: ${AZURE_TENANT_ID:common}
  issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/${azure.tenant-id}/v2.0}
  jwk-set-uri: ${AZURE_JWK_SET_URI:https://login.microsoftonline.com/${azure.tenant-id}/discovery/v2.0/keys}
  audience: ${AZURE_AUDIENCE:api://pedidos360-api}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
