server:
  port: 8080

spring:
  application:
    name: gateway-service

# Azure AD (Microsoft Entra ID) OAuth2 resource server settings.
azure:
  tenant-id: ${AZURE_TENANT_ID:common}
  issuer-uri: ${AZURE_ISSUER_URI:https://login.microsoftonline.com/${azure.tenant-id}/v2.0}
  jwk-set-uri: ${AZURE_JWK_SET_URI:https://login.microsoftonline.com/${azure.tenant-id}/discovery/v2.0/keys}
  audience: ${AZURE_AUDIENCE:api://pedidos360-api}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Downstream microservices (override with private EC2 IPs in production).
gateway:
  routes:
    pedidos: ${PEDIDOS_URL:http://localhost:8081}
    productos: ${PRODUCTOS_URL:http://localhost:8082}
    clientes: ${CLIENTES_URL:http://localhost:8083}
    notificaciones: ${NOTIFICACIONES_URL:http://localhost:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
